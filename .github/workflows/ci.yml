name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e packages/shared -e packages/security -e packages/ssg
          pip install -e "apps/api[dev]" pytest pytest-asyncio
      - name: Ruff
        run: |
          pip install ruff
          ruff check packages apps/api apps/worker
      - name: Tests
        run: pytest apps/api/tests -q
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "0"

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
