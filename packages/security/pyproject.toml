[project]
name = "site-panel-security"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "nh3>=0.2.18",
  "cryptography>=44.0.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_panel_security"]
