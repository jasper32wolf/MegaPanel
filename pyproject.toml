[project]
name = "site-panel"
version = "0.1.0"
description = "Single-operator self-hosted site panel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "site-panel-shared",
  "site-panel-security",
  "site-panel-ssg",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "redis>=5.2.0",
  "arq>=0.26.0",
  "httpx>=0.28.0",
  "nh3>=0.2.18",
  "argon2-cffi>=23.1.0",
  "PyJWT[crypto]>=2.10.0",
  "cryptography>=44.0.0",
  "python-multipart>=0.0.17",
  "prometheus-client>=0.21.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "structlog>=24.4.0",
  "pymorphy3>=2.0.2",
  "pillow>=11.0.0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-redis",
]

[tool.uv.sources]
site-panel-shared = { workspace = true }
site-panel-security = { workspace = true }
site-panel-ssg = { workspace = true }
site-panel-blocks = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/shared",
  "packages/security",
  "packages/ssg",
  "packages/block-library",
  "apps/api",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "app.api.deps.require_roles",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
