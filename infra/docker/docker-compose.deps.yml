# Lightweight deps for local hybrid install (API/panel on host, DB in Docker).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: site_panel
      POSTGRES_USER: site_panel
      POSTGRES_PASSWORD: site_panel_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_deps:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site_panel"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata_deps:
