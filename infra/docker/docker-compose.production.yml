name: site-panel

# Immutable release production stack. This file is intentionally separate from
# docker-compose.yml, which remains a development-oriented configuration.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    working_dir: /app/apps/api
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - sites_data:/app/dist
      - uploads_data:/app/uploads
      - dsar_data:/app/dsar
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
      SITES_ROOT: /app/dist
      CADDY_SITES_ROOT: /srv/sites
      UPLOADS_ROOT: /app/uploads
      DSAR_EXPORTS_ROOT: /app/dsar
      CADDY_ADMIN_URL: http://caddy:2019
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; raise SystemExit(0 if urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [internal]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - sites_data:/app/dist
      - dsar_data:/app/dsar
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
      SITES_ROOT: /app/dist
      DSAR_EXPORTS_ROOT: /app/dsar
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2.8-alpine
    user: "10001:10001"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
    volumes:
      - ./../caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - sites_data:/srv/sites:ro
      - type: volume
        source: caddy_data
        target: /data
        volume:
          nocopy: true
      - type: volume
        source: caddy_config
        target: /config
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [internal]

  panel:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.panel
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [internal]

networks:
  internal:
    name: site-panel-internal

volumes:
  pgdata:
    name: site-panel_pgdata
  sites_data:
    name: site-panel_sites_data
  uploads_data:
    name: site-panel_uploads_data
  dsar_data:
    name: site-panel_dsar_data
  caddy_data:
    name: site-panel_caddy_data
  caddy_config:
    name: site-panel_caddy_config
