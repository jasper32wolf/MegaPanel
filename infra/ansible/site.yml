# Intentional placeholder: Site Panel does not currently ship an Ansible deploy role.
#
# Public VPS deployment must use scripts/install-production-vps.sh followed by
# the immutable GitHub release workflow. This prevents an Ansible invocation
# from accidentally starting the development Compose stack with public ports.
#
# Do not add production hosts or tasks here until a provider-tested role has
# the same safeguards as the production installer: explicit domains, secrets,
# backup gate, volume ownership proof, firewall/SSH lockout protection and
# immutable release activation.
- hosts: all
  gather_facts: false
  tasks:
    - name: Explain supported deployment path
      ansible.builtin.fail:
        msg: >-
          Ansible provisioning is intentionally not implemented. Run
          scripts/install-production-vps.sh on a supported Linux VPS instead.
