# Site Panel — production bootstrap (phase 9 stub)

- hosts: all
  become: true
  tasks:
    - name: Ensure docker present
      ansible.builtin.package:
        name: docker.io
        state: present
      when: ansible_os_family == "Debian"

    - name: CrowdSec placeholder
      ansible.builtin.debug:
        msg: "Install CrowdSec / Fail2Ban on edge host"

    - name: Deploy compose stack
      ansible.builtin.command: docker compose -f infra/docker/docker-compose.yml up -d --build
      args:
        chdir: "{{ project_root | default('.') }}"
