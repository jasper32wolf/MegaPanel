[project]
name = "site-panel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "site-panel-shared",
  "site-panel-security",
  "site-panel-ssg",
  "site-panel-blocks",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "redis>=5.2.0",
  "arq>=0.26.0",
  "httpx>=0.28.0",
  "argon2-cffi>=23.1.0",
  "PyJWT[crypto]>=2.10.0",
  "cryptography>=44.0.0",
  "python-multipart>=0.0.17",
  "prometheus-client>=0.21.0",
  "structlog>=24.4.0",
  "email-validator>=2.2.0",
  "pyotp>=2.9.0",
  "pillow>=11.0.0",
  "pymorphy3>=2.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
