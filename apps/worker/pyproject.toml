[project]
name = "site-panel-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "site-panel-shared",
  "site-panel-security",
  "site-panel-ssg",
  "arq>=0.26.0",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
